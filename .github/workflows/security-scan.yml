name: Security scan skills

on:
  push:
    branches: [main]
    paths: ['skills/**']
  pull_request:
    paths: ['skills/**']
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snyk-agent-scan:
    # Skip scheduled runs on forks, and never execute MCP servers from
    # untrusted fork pull requests (--dangerously-run-mcp-servers runs PR code).
    if: >-
      (github.event_name != 'schedule' || github.repository_owner == 'samber') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Report-only. Fixable findings ARE fixed (W008 example secrets: no basic-auth
    # user:pass@ structures, no high-entropy literals). The residual high findings
    # are INHERENT to two skills and exist identically upstream — they cannot be
    # removed without breaking the skill's purpose:
    #   - golang-continuous-integration: the AI code-review workflow reads PR
    #     content via `gh pr diff`/`gh pr view` (W011) and references the skills
    #     repo URL (W012).
    #   - golang-pkg-go-dev: godig fetches pkg.go.dev docs (W011) and can use the
    #     hosted godig MCP endpoint (W012).
    # So the scan stays visible in logs without red-failing the build. Replace with
    # a scoped ignore policy if snyk-agent-scan gains one for these by-design rules.
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run Snyk Agent Scan
        # Skip on forks/clones without a SNYK_TOKEN so the scan does not hard-fail CI;
        # it still runs wherever the secret is configured (e.g. upstream).
        if: ${{ env.SNYK_TOKEN != '' }}
        # Pin the tool version (no @latest) so a new release can't change behavior unreviewed.
        run: uvx snyk-agent-scan==0.5.12 --ci --dangerously-run-mcp-servers --skills ./skills
