name: Security scan skills

on:
  push:
    branches: [main]
    paths: ['skills/**']
  pull_request:
    paths: ['skills/**']
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snyk-agent-scan:
    # Skip scheduled runs on forks, and never execute MCP servers from
    # untrusted fork pull requests (--dangerously-run-mcp-servers runs PR code).
    if: >-
      (github.event_name != 'schedule' || github.repository_owner == 'samber') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Gating: skill bodies and CI/security example assets have been reformulated
    # to clear the W008/W011/W012 findings (placeholder secrets, passive
    # third-party-content phrasing, pinned actions). The scan now fails the build
    # on new findings. If a finding is a deliberate false positive, add a scoped
    # ignore rather than reinstating continue-on-error.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Run Snyk Agent Scan
        # Skip on forks/clones without a SNYK_TOKEN so the scan does not hard-fail CI;
        # it still runs wherever the secret is configured (e.g. upstream).
        if: ${{ env.SNYK_TOKEN != '' }}
        # Pin the tool version (no @latest) so a new release can't change behavior unreviewed.
        run: uvx snyk-agent-scan==0.5.12 --ci --dangerously-run-mcp-servers --skills ./skills
